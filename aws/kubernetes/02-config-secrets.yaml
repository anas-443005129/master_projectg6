---
# Namespace for Infracork application
apiVersion: v1
kind: Namespace
metadata:
  name: infracork
  labels:
    app: infracork

---
# ConfigMap for application environment variables
apiVersion: v1
kind: ConfigMap
metadata:
  name: infracork-app-config
  namespace: infracork
data:
  NODE_ENV: "production"
  NEXTAUTH_URL: "https://infrarock.tech"
  AUTHJS_URL: "https://infrarock.tech"
  AUTH_TRUST_HOST: "true"
  AUTHJS_TRUST_HOST: "true"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "infracorkapp"
  POSTGRES_USER: "postgres"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  

---
# Secret for sensitive data
apiVersion: v1
kind: Secret
metadata:
  name: infracork-app-secrets
  namespace: infracork
type: Opaque
stringData:
  AUTH_SECRET: "infracorkapp-secret-key-change-in-prod"
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_URL: "postgres://postgres:postgres@postgres:5432/infracorkapp" 
  AI_GATEWAY_API_KEY: "vck_12s53H3hp3Ifbgg4430MGkkOfJ4NSWrxAKpIsRMpCxvt9Fomun0Wz0wm" 
  REDIS_URL: "redis://redis:6379"

---
# Note: ECR credentials are handled via IAM roles attached to EKS nodes
# No need for explicit docker config secrets
