---
# Infracorkapp Service
apiVersion: v1
kind: Service
metadata:
  name: infracorkapp
  namespace: infracork
  labels:
    app: infracorkapp
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: infracorkapp

---
# Infracorkapp Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infracorkapp
  namespace: infracork
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: infracorkapp
  template:
    metadata:
      labels:
        app: infracorkapp
    spec:
      containers:
        - name: infracorkapp
          image: 319191252186.dkr.ecr.eu-central-1.amazonaws.com/infracork-app-infracork:v20251130-02
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: infracork-app-config
            - secretRef:
                name: infracork-app-secrets
          env:
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: infracork-app-secrets
                  key: DATABASE_URL
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: tmp
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
