---
# IngressClass for ALB
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: alb
spec:
  controller: elbv2.k8s.aws/alb

---
# Ingress for Infracorkapp with ALB and TLS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infracorkapp-ingress
  namespace: infracork
  annotations:
    # ALB Annotations
    alb.ingress.kubernetes.io/load-balancer-name: infracork-alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/subnets: subnet-06a231048d33c7be6,subnet-0902a64e0abf10df6,subnet-0db23e76708b9cf12
    alb.ingress.kubernetes.io/security-groups: sg-0951aad48669e11b0
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-central-1:319191252186:certificate/f62f3c13-a924-414e-8068-aea43361788a
    
    # Health check settings
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
    
    # Tags for ALB
    alb.ingress.kubernetes.io/tags: Environment=production,Project=Infracork
spec:
  ingressClassName: alb
  rules:
    - host: infrarock.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: infracorkapp
                port:
                  number: 3000
    - host: www.infrarock.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: infracorkapp
                port:
                  number: 3000
